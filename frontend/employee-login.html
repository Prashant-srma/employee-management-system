<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Login · EMS</title><link rel="stylesheet" href="/css/global.css"><script src="https://unpkg.com/lucide@latest"></script></head><body><div class="auth-page"><section class="auth-brand"><div><h1 class="landing-title">Employee<br>Management System</h1><p class="landing-copy">Streamline your workforce operations, track attendance, manage payroll, and empower your team securely.</p></div></section><section class="auth-form-wrap"><form class="auth-form" id="loginForm"><a class="back-link" href="/"><i data-lucide="arrow-left" style="width:14px"></i> Back to portals</a><h1>Employee Portal</h1><p class="subtitle">Sign in to access your account</p><div id="error"></div><div class="auth-field"><label class="form-label">Email address</label><input class="input" id="email" type="email" placeholder="john@example.com" required></div><div class="auth-field"><label class="form-label">Password</label><div class="password-wrap"><input class="input" id="password" type="password" placeholder="••••••••" required><button type="button" class="password-toggle" id="toggle"><i data-lucide="eye"></i></button></div></div><button class="btn btn-primary auth-submit" id="submit">Sign in</button><p class="help" style="margin-top:16px">Demo employee: john@example.com / employee123</p></form></section></div><script src="/js/api.js"></script><script src="/js/utils.js"></script><script>lucide.createIcons();document.getElementById('toggle').onclick=()=>{const p=document.getElementById('password');p.type=p.type==='password'?'text':'password'};document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit'),err=document.getElementById('error');err.innerHTML='';Utils.setButtonLoading(b,true);try{await API.post('/api/auth/employee/login',{email:email.value,password:password.value});location.href='/employee/dashboard.html'}catch(x){err.innerHTML='<div class="error-box">'+Utils.esc(x.message)+'</div>';Utils.setButtonLoading(b,false,'Sign in')}};</script></body></html>
